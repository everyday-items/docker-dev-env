# Kafka Cluster - 3 Broker（KRaft 模式，SASL 认证）
services:
  kafka-1:
    image: bitnami/kafka:3.6
    container_name: kafka-1
    ports:
      - "9092:9092"
      - "9192:9192"
    environment:
      # KRaft 配置
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 监听配置（启用 SASL）
      KAFKA_CFG_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093,SASL_EXTERNAL://:9192
      KAFKA_CFG_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka-1:9092,SASL_EXTERNAL://localhost:9192
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_EXTERNAL:SASL_PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      # SASL 认证
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CLIENT_USERS: app
      KAFKA_CLIENT_PASSWORDS: kafka123
      KAFKA_INTER_BROKER_USER: admin
      KAFKA_INTER_BROKER_PASSWORD: kafka123
      # 集群配置
      KAFKA_KRAFT_CLUSTER_ID: kafka-cluster-001
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_NUM_PARTITIONS: 3
      TZ: Asia/Shanghai
    volumes:
      - ./data/kafka-1:/bitnami/kafka
    networks:
      - kafka-cluster-net
    restart: unless-stopped

  kafka-2:
    image: bitnami/kafka:3.6
    container_name: kafka-2
    ports:
      - "9095:9092"
      - "9193:9192"
    environment:
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093,SASL_EXTERNAL://:9192
      KAFKA_CFG_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka-2:9092,SASL_EXTERNAL://localhost:9193
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_EXTERNAL:SASL_PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CLIENT_USERS: app
      KAFKA_CLIENT_PASSWORDS: kafka123
      KAFKA_INTER_BROKER_USER: admin
      KAFKA_INTER_BROKER_PASSWORD: kafka123
      KAFKA_KRAFT_CLUSTER_ID: kafka-cluster-001
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_NUM_PARTITIONS: 3
      TZ: Asia/Shanghai
    volumes:
      - ./data/kafka-2:/bitnami/kafka
    networks:
      - kafka-cluster-net
    restart: unless-stopped

  kafka-3:
    image: bitnami/kafka:3.6
    container_name: kafka-3
    ports:
      - "9096:9092"
      - "9194:9192"
    environment:
      KAFKA_CFG_NODE_ID: 3
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093,SASL_EXTERNAL://:9192
      KAFKA_CFG_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka-3:9092,SASL_EXTERNAL://localhost:9194
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_EXTERNAL:SASL_PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CLIENT_USERS: app
      KAFKA_CLIENT_PASSWORDS: kafka123
      KAFKA_INTER_BROKER_USER: admin
      KAFKA_INTER_BROKER_PASSWORD: kafka123
      KAFKA_KRAFT_CLUSTER_ID: kafka-cluster-001
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_NUM_PARTITIONS: 3
      TZ: Asia/Shanghai
    volumes:
      - ./data/kafka-3:/bitnami/kafka
    networks:
      - kafka-cluster-net
    restart: unless-stopped

  # Kafka UI（带 SASL 认证）
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"app\" password=\"kafka123\";"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - kafka-cluster-net
    restart: unless-stopped

networks:
  kafka-cluster-net:
    driver: bridge
