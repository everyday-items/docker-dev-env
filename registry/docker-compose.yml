services:
  registry:
    image: registry:2
    container_name: registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/var/lib/registry
      - ./config.yml:/etc/docker/registry/config.yml:ro
      - ./htpasswd:/auth/htpasswd:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--user", "admin", "--password", "registry123", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - dev-net

  registry-ui:
    image: joxit/docker-registry-ui:main
    container_name: registry-ui
    ports:
      - "${REGISTRY_UI_PORT:-8080}:80"
    environment:
      REGISTRY_TITLE: "Local Docker Registry"
      REGISTRY_URL: http://registry:5000
      SINGLE_REGISTRY: "true"
      DELETE_IMAGES: "true"
      # UI 认证（与 Registry 相同凭据）
      NGINX_PROXY_PASS_URL: http://registry:5000
    depends_on:
      - registry
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - dev-net

networks:
  dev-net:
    external: true
