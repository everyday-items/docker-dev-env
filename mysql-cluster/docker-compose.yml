# MySQL 主从集群（1 主 + 2 从）
services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    ports:
      - "${MYSQL_MASTER_PORT:-3316}:3306"
    environment:
      # 使用文件方式读取密码
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      TZ: Asia/Shanghai
    volumes:
      - ./data/master:/var/lib/mysql
      - ./conf/master.cnf:/etc/mysql/conf.d/master.cnf:ro
      - ./init/master-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./secrets:/run/secrets:ro
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW
    networks:
      - mysql-cluster-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$(cat /run/secrets/mysql_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 3

  mysql-slave-1:
    image: mysql:8.0
    container_name: mysql-slave-1
    ports:
      - "${MYSQL_SLAVE1_PORT:-3317}:3306"
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: Asia/Shanghai
    volumes:
      - ./data/slave-1:/var/lib/mysql
      - ./conf/slave.cnf:/etc/mysql/conf.d/slave.cnf:ro
      - ./secrets:/run/secrets:ro
    command: --server-id=2 --relay-log=relay-log --read-only=1
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - mysql-cluster-net
    restart: unless-stopped

  mysql-slave-2:
    image: mysql:8.0
    container_name: mysql-slave-2
    ports:
      - "${MYSQL_SLAVE2_PORT:-3318}:3306"
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: Asia/Shanghai
    volumes:
      - ./data/slave-2:/var/lib/mysql
      - ./conf/slave.cnf:/etc/mysql/conf.d/slave.cnf:ro
      - ./secrets:/run/secrets:ro
    command: --server-id=3 --relay-log=relay-log --read-only=1
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - mysql-cluster-net
    restart: unless-stopped

networks:
  mysql-cluster-net:
    driver: bridge
