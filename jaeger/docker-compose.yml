services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"           # Web UI
      - "${JAEGER_COLLECTOR_PORT:-14268}:14268"   # HTTP Collector
      - "${JAEGER_GRPC_PORT:-14250}:14250"        # gRPC Collector (go-zero 默认用这个)
      - "6831:6831/udp"                            # UDP Agent (Thrift compact)
      - "6832:6832/udp"                            # UDP Agent (Thrift binary)
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
      COLLECTOR_OTLP_ENABLED: true
      TZ: Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dev-net
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  dev-net:
    external: true
