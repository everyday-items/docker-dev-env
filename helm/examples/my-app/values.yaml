# 默认配置

replicaCount: 2

image:
  repository: localhost:5000/my-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: my-app.local

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

# 应用配置
config:
  env: development
  logLevel: info
