services:
  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: elasticsearch
    ports:
      - "${ES_PORT:-9200}:9200"
      - "${ES_TRANSPORT_PORT:-9300}:9300"
    environment:
      - discovery.type=single-node
      # 启用安全
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      # 禁用 HTTPS（开发环境简化配置）
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # 设置内置用户密码
      - ELASTIC_PASSWORD=${ES_PASSWORD:-elastic123}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ES_PASSWORD:-elastic123} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - dev-net
    ulimits:
      memlock:
        soft: -1
        hard: -1

networks:
  dev-net:
    external: true
