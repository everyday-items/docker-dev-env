# Redis Cluster - 6 节点（3 主 + 3 从）
services:
  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    ports:
      - "6371:6379"
      - "16371:16379"
    volumes:
      - ./data/node-1:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./users.acl:/usr/local/etc/redis/users.acl:ro
    command: redis-server /usr/local/etc/redis/redis.conf --port 6379 --cluster-announce-ip ${HOST_IP:-127.0.0.1} --cluster-announce-port 6371 --cluster-announce-bus-port 16371
    networks:
      - redis-cluster-net

  redis-node-2:
