# Redis Cluster 配置

# 启用集群模式
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000

# ACL 认证（Redis 6+ 推荐方式）
aclfile /usr/local/etc/redis/users.acl
# 节点间通信认证（使用 app 用户密码）
masterauth redis123

# 数据持久化
appendonly yes
appendfilename "appendonly.aof"

# 内存
maxmemory 100mb
maxmemory-policy allkeys-lru

# 日志
loglevel notice
