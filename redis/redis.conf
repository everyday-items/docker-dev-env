# Redis 配置 - 开发环境

# 网络
bind 0.0.0.0
port 6379
protected-mode yes

# ACL 认证（Redis 6+ 推荐方式）
aclfile /usr/local/etc/redis/users.acl

# 内存限制（防止耗尽系统内存）
maxmemory 200mb
maxmemory-policy allkeys-lru

# 数据持久化
dir /data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 日志
loglevel notice
logfile ""

# 前台运行（Docker 管理）
daemonize no

# 性能优化
tcp-keepalive 300
timeout 0
