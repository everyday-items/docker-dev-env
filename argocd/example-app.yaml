# ArgoCD Application 示例
# 用法: kubectl apply -f example-app.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default

  # Git 仓库配置
  source:
    repoURL: https://github.com/your-org/your-repo.git
    targetRevision: HEAD
    path: k8s/manifests  # K8s 配置文件路径

  # 目标集群
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  # 同步策略
  syncPolicy:
    automated:
      prune: true      # 自动删除不在 Git 中的资源
      selfHeal: true   # 自动修复漂移
    syncOptions:
      - CreateNamespace=true
