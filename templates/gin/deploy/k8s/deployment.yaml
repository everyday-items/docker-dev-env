# Gin K8s 部署配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gin-api
  labels:
    app: gin-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gin-api
  template:
    metadata:
      labels:
        app: gin-api
    spec:
      containers:
        - name: api
          image: localhost:5000/gin-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: GIN_MODE
              value: release
            - name: TZ
              value: Asia/Shanghai
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: gin-config
                  key: db_host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gin-secret
                  key: db_password
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gin-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: gin-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gin-api
spec:
  ingressClassName: nginx
  rules:
    - host: gin.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gin-api
                port:
                  number: 80
