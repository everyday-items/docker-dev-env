# Air 热重载配置
# 文档: https://github.com/cosmtrek/air

root = "."
tmp_dir = "tmp"

[build]
# 编译命令
cmd = "go build -o ./tmp/main ./cmd/api/main.go"
# 二进制文件
bin = "./tmp/main -f etc/config.yaml"
# 监听文件扩展名
include_ext = ["go", "yaml", "yml"]
# 排除目录
exclude_dir = ["tmp", "vendor", "deploy", ".git"]
# 排除文件
exclude_file = []
# 延迟执行（毫秒）
delay = 1000
# 发生错误时停止
stop_on_error = true
# 日志输出
log = "air.log"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
