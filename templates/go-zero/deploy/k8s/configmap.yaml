# ConfigMap - 非敏感配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: go-zero-config
data:
  mysql_host: "mysql.default.svc.cluster.local"
  redis_host: "redis.default.svc.cluster.local"
  etcd_host: "etcd.default.svc.cluster.local:2379"

  # 应用配置文件
  config.yaml: |
    Name: go-zero-api
    Host: 0.0.0.0
    Port: 8080
    Mode: pro

    Log:
      ServiceName: go-zero-api
      Mode: file
      Path: logs
      Level: info
      Compress: true
      KeepDays: 7

    Telemetry:
      Name: go-zero-api
      Endpoint: http://jaeger.default.svc.cluster.local:14268/api/traces
      Batcher: jaeger

    Prometheus:
      Host: 0.0.0.0
      Port: 9081
      Path: /metrics

    MySQL:
      DataSource: root:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/app?charset=utf8mb4&parseTime=True&loc=Local

    Redis:
      Host: ${REDIS_HOST}:6379
      Type: node

    Etcd:
      Hosts:
        - ${ETCD_HOST}
      Key: go-zero-api
