services:
  kibana:
    image: kibana:8.15.0
    container_name: kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=${ES_HOSTS:-http://host.docker.internal:9200}
      # ES 认证配置
      - ELASTICSEARCH_USERNAME=${ES_USERNAME:-elastic}
      - ELASTICSEARCH_PASSWORD=${ES_PASSWORD:-elastic123}
      - TZ=Asia/Shanghai
      - I18N_LOCALE=zh-CN
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dev-net
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  dev-net:
    external: true
