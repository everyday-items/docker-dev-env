# Kind 集群配置 - 多节点（1 控制面 + 2 工作节点）
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-cluster
nodes:
  # 控制面节点
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # NodePort 范围
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
  # 工作节点 1
  - role: worker
  # 工作节点 2
  - role: worker

networking:
  # Pod 子网
  podSubnet: "10.244.0.0/16"
  # Service 子网
  serviceSubnet: "10.96.0.0/12"
