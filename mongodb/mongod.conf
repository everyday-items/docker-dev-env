# MongoDB 配置 - 开发环境

# 网络
net:
  port: 27017
  bindIp: 0.0.0.0

# 存储
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25

# 日志
systemLog:
  destination: file
  path: /data/db/mongod.log
  logAppend: true

# 安全（开发环境启用认证）
security:
  authorization: enabled
