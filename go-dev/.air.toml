# Air 热重载配置
root = "."
tmp_dir = "tmp"

[build]
# 编译命令
cmd = "go build -o ./tmp/main ."
# 监听的文件扩展名
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml"]
# 排除目录
exclude_dir = ["assets", "tmp", "vendor", "frontend", "node_modules", "data", "logs"]
# 排除文件
exclude_file = []
# 排除正则
exclude_regex = ["_test.go"]
# 排除不变的文件
exclude_unchanged = true
# 跟踪符号链接目录
follow_symlink = false
# 延迟执行（毫秒）
delay = 1000
# 发生构建错误时停止运行旧的二进制文件
stop_on_error = true
# 发送中断信号
send_interrupt = false
# 中断信号超时（秒）
kill_delay = 500

[log]
# 显示日志时间
time = true

[color]
# 自定义颜色
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# 退出时清理临时目录
clean_on_exit = true
